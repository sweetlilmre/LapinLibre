# SPDX-License-Identifier: MIT
# LapinLibre's build configuration: versions, pinned downloads and limits.
# Every download is checked against its sha256 (or git commit) before use.

[key.md5]
# Files the key carries from the repo exactly as they are, by MD5: image/usbkey/autorun.sig is
# Violet's clearsigned file. The factory system runs a stick's autorun only when
# `gpg --verify autorun.sig` passes, and nobody can sign a new one.
"autorun.sig" = "03076decb9e153b552d13196f5971ca4"
# Karotz's keyring in the core's root filesystem ("part:path", from image/core; image.py's
# check_pinned).
"rootfs:karotz/etc/gpg/pubring.gpg" = "f9242e4ba243279123b1cd0a02528a31"
"rootfs:karotz/etc/gpg/trustdb.gpg" = "add402e275ef6ba90f99da7ad56391cc"

[limits]
# The rabbit's flash and RAM disk: /proc/mtd gives mtd1 "Kernel" 0x300000 and
# mtd2 "ramdisk" 0x500000; the bootloader loads mtd2 as a gzipped initrd
# (initrd=0x31800000,0x00500000) into ram0, 10240 sectors (5 MiB). So the
# gzipped root filesystem must fit mtd2 and the unpacked cramfs ram0.
kernel_bytes = 3145728
rootfs_gz_bytes = 5242880
rootfs_bytes = 5242880

[kernel]
# The machine name the kernel reports (MACHINE_START in the board file).
machine = "RABBITV3 (KAROTZ)"
localversion = "-sweetlilmre"
build_user = "sweetlilmre"
build_host = "sweetlilmre-builder"
# The fixed path the tree is built at (inside the build's namespace), so the
# source path the kernel embeds is the same for every build.
build_path = "/build/karotz-kernel"

[toolchain]
# The cross toolchain the system build uses (system/toolchain/build.sh): GCC, binutils and
# uClibc-ng for the ARM920T, built by Buildroot from system/toolchain/buildroot.config and packed
# as an SDK. name is its release: the tag it is published under and its file, name + ".tar.gz".
# Raise the last number when the toolchain changes. With a [download.toolchain] pin the build
# fetches the published toolchain; without one, or with LAPIN_TOOLCHAIN=build, it builds it.
name = "toolchain-gcc14.3.0-uclibc-ng1.0.57-1"

# ---------------------------------------------------------------------------
# Downloads. group: which stage needs it (fetch.py --group GROUP).

# V8 2.5.9.23, the last release of 2.5.8's branch: the system build's libv8.so
# (system/v8/build.sh) and the headers the system build's karotzVM builds against.

# The published cross toolchain ([toolchain]; system/toolchain/build.sh), built by the toolchain
# workflow (.github/workflows/toolchain.yml).

[download.toolchain]
group = "toolchain"
urls = ["https://github.com/sweetlilmre/LapinLibre/releases/download/toolchain-gcc14.3.0-uclibc-ng1.0.57-1/toolchain-gcc14.3.0-uclibc-ng1.0.57-1.tar.gz"]
file = "toolchain-gcc14.3.0-uclibc-ng1.0.57-1.tar.gz"
sha256 = "afa4c1f076773f8715431fe61854e46796bf8c8c3eee25b32f8cb55e957a5f6b"

[download.v8-branch-src]
group = "v8"
urls = ["https://github.com/v8/v8/archive/refs/tags/2.5.9.23.tar.gz"]
file = "v8-2.5.9.23.tar.gz"
