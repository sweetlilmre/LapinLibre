# SPDX-License-Identifier: MIT
[project]
name = "lapinlibre-app-server"
version = "0.1.0"
description = "A replacement Karotz platform server and speech server"
requires-python = ">=3.10"
# All optional at run time: without them the servers fall back to the
# protoc and ffmpeg commands, and the speech server to espeak-ng or
# Windows' speech.
dependencies = [
    "protobuf>=7.35",  # platform_message_pb2.py was generated for 7.35
    "lameenc>=1.7",
    "kokoro-onnx==0.6.1",  # the version image/tools/install_prompts.py.lock has
]

[tool.uv]
package = false
