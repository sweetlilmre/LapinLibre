# BusyBox mdev's rules (linked as /etc/mdev.conf by linuxrc). Fields: device-regex uid:gid mode
# [command], where the command's first character says when it runs: @ after the node is made,
# $ before it is removed, * both. Devices no rule names get mdev's default, root's and mode 0660.
# Requested firmware (the Wi-Fi's rt73.bin) is loaded by mdev itself from /lib/firmware.

# The USB stick (ub disks, major 180, and their partitions): mounted on /mnt/usbkey, unmounted when
# it goes.
ub[a-z][0-9]*    0:0 0660 */karotz/scripts/usbkey.sh

# Quirk: a USB network adapter's interface is brought up when it appears.
SUBSYSTEM=net;eth0    0:0 0660 @/sbin/ifconfig eth0 up
