# The fixed part of BusyBox httpd's settings for the rabbit's web page (/usr/www). inetd.sh copies
# its index and type lines into the configuration it makes in RAM at boot (/var/run/httpd.conf),
# which adds the local-network rules and the password; httpd reads that one. Used directly, this
# file refuses every client.
I:index.html
D:*
