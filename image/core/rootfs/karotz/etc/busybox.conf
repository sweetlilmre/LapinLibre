# BusyBox's setuid rules (/bin/busybox is setuid root). Root is never checked. For any other user,
# an applet keeps root only when this file says so; an applet not named here runs as its caller,
# except the applets BusyBox marks as needing setuid, which are all named below without it.
# Modes: three characters for the owner, the group and the others; s runs it as USER, x runs it as
# the caller, - refuses it.
[SUID]
# The web API's reboot (cgi-bin/reboot), for the group web only.
reboot = sx- root.web
# The applets BusyBox would otherwise leave setuid: each runs as its caller.
busybox = xxx root.root
crontab = xxx root.root
findfs = xxx root.root
login = xxx root.root
mount = xxx root.root
passwd = xxx root.root
ping = xxx root.root
ping6 = xxx root.root
su = xxx root.root
traceroute = xxx root.root
traceroute6 = xxx root.root
vlock = xxx root.root
wall = xxx root.root
