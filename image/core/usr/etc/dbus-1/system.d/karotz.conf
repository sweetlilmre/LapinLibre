<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- SPDX-License-Identifier: MIT -->
<!-- The rabbit's own services (LapinLibre): root may own any com.mindscape.karotz name and call
     the services that do. The group web (the web API and its tag listener) may call them, but owns
     no name. -->
<busconfig>
  <policy user="root">
    <allow own_prefix="com.mindscape.karotz"/>
    <allow send_destination_prefix="com.mindscape.karotz"/>
  </policy>
  <policy group="web">
    <allow send_destination_prefix="com.mindscape.karotz"/>
  </policy>
</busconfig>
