# SPDX-License-Identifier: MIT
# k2k-daemon's SIP and audio settings (linphone 3.4), read as linphone's factory configuration.
# The SIP account, the STUN server, the ring and video are set by k2k-daemon itself. Each value
# here is linphone's own default, written out. A comment line must not hold an equals sign
# (linphone would read it as a setting).

[sound]
# The rabbit's OSS device (linphone names it "OSS: <device>") for the call and its microphone.
playback_dev_id=OSS: /dev/dsp
ringer_dev_id=OSS: /dev/dsp
capture_dev_id=OSS: /dev/dsp
echocancellation=0

[sip]
sip_port=5060
use_ipv6=0

[rtp]
audio_rtp_port=7078
audio_jitt_comp=60
nortp_timeout=30
