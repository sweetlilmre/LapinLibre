# mpd's settings (mpd 0.15). multimedia-daemon starts mpd with this file when it can't connect,
# and plays the music on the USB stick through it; the core's stick hook (/usr/etc/usbkey.d/50mpd) asks it
# to rescan when a stick comes or goes.

# The music: the USB stick, which usbkey.sh mounts here (vfat, the kernel's default iso8859-1
# names, which mpd converts to UTF-8 for its clients).
music_directory         "/mnt/usbkey"
filesystem_charset      "ISO-8859-1"
# Saved playlists (multimedia-daemon's playlist:: plays one by name) live on the flash.
playlist_directory      "/usr/etc/mpd/playlists"

# The song database, the log, the pid and the play state go to /var (RAM): the database is
# rebuilt from the stick, and nothing here needs to outlive a reboot.
db_file                 "/var/mpd.db"
log_file                "/var/log/mpd.log"
pid_file                "/var/run/mpd.pid"
state_file              "/var/mpd.state"

# multimedia-daemon connects to 127.0.0.1:6600; other MPD clients on the network may too.
bind_to_address         "any"
port                    "6600"

# Without a password a client can do nothing. The first line is multimedia-daemon's (all
# rights; a rescan hook takes the first password). The second is for external MPD
# clients: exactly read, add and control, which mpd counts in its status (count_externalClient),
# so the rabbit knows another client is playing.
password                "karotz_admin@read,add,control,admin"
password                "lapinlibre@read,add,control"

# The one output (multimedia-daemon switches output 0 on and off): the OSS device, with the
# volume set in software, so it doesn't depend on which mixer controls the codec has.
audio_output {
        type            "oss"
        name            "Karotz"
        device          "/dev/dsp"
}
mixer_type              "software"
